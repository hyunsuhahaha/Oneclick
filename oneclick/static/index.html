<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oneclick</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f5bea; --ok: #1f8a4c; --bad: #c9352b; --run: #b7791f; --code: #16181d; --codetext: #d6d8de;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121315; --panel: #1b1c1f; --text: #ececee; --muted: #9a9aa1; --line: #2c2d31;
            --accent: #7b9bff; --ok: #4cc27f; --bad: #ff6b60; --run: #e3a943; --code: #0c0d0f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px;
                     background: var(--bg); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 220px; gap: 12px; margin-bottom: 14px; }
  .targets { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .target { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line);
            border-radius: 8px; padding: 9px 12px; min-width: 220px; cursor: pointer; }
  .target.off { opacity: .55; cursor: not-allowed; }
  .target small { display: block; color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 0; border-radius: 7px; padding: 9px 18px; cursor: pointer;
           background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; font-weight: 500; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); margin-left: 12px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .rel { border-bottom: 1px solid var(--line); padding: 11px 0; cursor: pointer; }
  .rel:last-child { border-bottom: 0; }
  .rel.sel { background: color-mix(in srgb, var(--accent) 7%, transparent); margin: 0 -18px; padding: 11px 18px; }
  .rel-head { display: flex; justify-content: space-between; gap: 8px; }
  .rel-head b { font-size: 15px; }
  .rel-head span { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  .dep { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 5px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
  .live { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .building, .deploying, .queued { color: var(--run); background: color-mix(in srgb, var(--run) 16%, transparent); }
  .superseded { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
  .dep a { color: var(--accent); word-break: break-all; }
  .dep .e { color: var(--bad); }
  pre { background: var(--code); color: var(--codetext); border-radius: 8px; padding: 12px; margin: 0;
        height: 520px; overflow: auto; font: 12.5px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .scope { color: #7fb4ff; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 760px) { .row, .grid { grid-template-columns: 1fr; } .target { min-width: 0; flex: 1 1 100%; } }
</style>
</head>
<body>
<main>
  <h1>oneclick</h1>
  <p class="sub">One Action, Infinite Clouds: 로컬 웹앱을 여러 배포 대상에 한 번에 배포합니다.</p>

  <section class="panel">
    <div class="row">
      <div><label class="field" for="source">소스 (로컬 폴더 경로 또는 Git URL)</label>
        <input type="text" id="source" placeholder="./examples/hello-node 또는 https://github.com/..."></div>
      <div><label class="field" for="app">앱 이름 (비우면 자동)</label>
        <input type="text" id="app" placeholder="hello-node"></div>
    </div>
    <label class="field">배포 대상</label>
    <div class="targets" id="targets"></div>
    <button id="deploy">배포</button><span class="err" id="err"></span>
  </section>

  <div class="grid">
    <section class="panel"><h2>배포 이력</h2><div id="releases"><p class="empty">아직 배포가 없습니다.</p></div></section>
    <section class="panel"><h2>로그 <span class="empty" id="logfor"></span></h2><pre id="log"></pre></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let selected = null, es = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function loadTargets() {
  const ts = await api("/api/targets");
  $("targets").innerHTML = ts.map(t => `
    <label class="target ${t.problem ? "off" : ""}">
      <input type="checkbox" value="${t.name}" ${t.problem ? "disabled" : (t.kind === "local" ? "checked" : "")}>
      <span>${t.label}<small>${t.problem || "준비됨"}</small></span>
    </label>`).join("");
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function loadReleases() {
  const rels = await api("/api/releases");
  if (!rels.length) return;
  $("releases").innerHTML = rels.map(r => `
    <div class="rel ${r.id === selected ? "sel" : ""}" data-id="${r.id}">
      <div class="rel-head"><b>${esc(r.app)}${r.kind === "rollback" ? " · 롤백" : ""}</b><span>${r.id}</span></div>
      ${r.deployments.map(d => `
        <div class="dep">
          <span class="badge ${d.status}">${d.status}</span><b>${d.target}</b>
          ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a>` : ""}
          ${d.error ? `<span class="e">${esc(d.error.split("\n")[0])}</span>` : ""}
          ${d.status === "live" ? `<button class="ghost" data-rb="${esc(r.app)}|${d.target}">이전 버전으로</button>` : ""}
        </div>`).join("")}
    </div>`).join("");
}

function watch(rid) {
  selected = rid;
  if (es) es.close();
  $("log").textContent = "";
  $("logfor").textContent = rid;
  es = new EventSource(`/api/releases/${rid}/logs`);
  es.onmessage = (e) => {
    const r = JSON.parse(e.data), pre = $("log");
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
    pre.insertAdjacentHTML("beforeend", `<span class="scope">[${esc(r.scope)}]</span> ${esc(r.line)}\n`);
    if (stick) pre.scrollTop = pre.scrollHeight;
  };
  es.addEventListener("done", () => { es.close(); loadReleases(); });
  loadReleases();
}

$("deploy").onclick = async () => {
  $("err").textContent = "";
  const targets = [...document.querySelectorAll("#targets input:checked")].map(i => i.value);
  $("deploy").disabled = true;
  try {
    const { release_id } = await api("/api/deploy", { source: $("source").value.trim(), app: $("app").value.trim() || null, targets });
    watch(release_id);
  } catch (e) { $("err").textContent = e.message; }
  finally { $("deploy").disabled = false; }
};

$("releases").onclick = async (e) => {
  const rb = e.target.closest("[data-rb]");
  if (rb) {
    const [app, target] = rb.dataset.rb.split("|");
    try { watch((await api("/api/rollback", { app, target })).release_id); }
    catch (err) { $("err").textContent = err.message; }
    return;
  }
  const rel = e.target.closest(".rel");
  if (rel && !e.target.closest("a")) watch(rel.dataset.id);
};

loadTargets();
loadReleases();
setInterval(loadReleases, 2000);
</script>
</body>
</html>
